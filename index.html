<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronimium</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body {
      background: #090909;
      color: #e0e0e0;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .navbar {
      background: #111;
      border-bottom: 1px solid #222;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-left { display: flex; align-items: center; gap: 32px; }
    .logo { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 1px; }
    .nav-links { display: flex; gap: 8px; }
    .nav-btn {
      background: transparent;
      border: none;
      color: #888;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .nav-btn:hover, .nav-btn.active { background: #1a1a1a; color: #fff; }

    .main { 
      max-width: 560px; 
      margin: 40px auto; 
      padding: 0 20px; 
      position: relative;
      z-index: 1;
    }
    .page { display: none; }
    .page.active { display: block; }

    .card {
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 0 40px rgba(255,255,255,0.03);
    }

    .brand {
      font-size: 15px;
      color: #888;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    h2 { font-size: 22px; margin-bottom: 6px; color: #fff; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 28px; }

    input, select {
      width: 100%;
      background: #0a0a0a !important;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 14px 16px;
      color: #fff !important;
      font-size: 15px;
      outline: none;
      margin-bottom: 16px;
      transition: 0.2s;
    }
    input:focus, select:focus {
      border-color: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
    }
    input::placeholder { color: #555; }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #aaa;
    }
    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #fff;
      cursor: pointer;
    }

    button.primary {
      width: 100%;
      background: linear-gradient(135deg, #fff, #d0d0d0);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    button.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,255,255,0.2);
    }

    .result { margin-top: 20px; display: none; }
    .result input { color: #fff !important; font-size: 13px; }
    .copy-btn {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #fff;
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .links-grid { display: grid; gap: 16px; }
    .link-card {
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .link-info h3 { font-size: 16px; color: #fff; margin-bottom: 4px; }
    .link-info p { font-size: 13px; color: #666; }
    .open-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }

    .empty { text-align: center; color: #555; padding: 40px 20px; }

    /* UNLOCK PAGE (Updated to match dark dashboard theme) */
    .unlock-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .unlock-card {
      width: 100%;
      max-width: 460px;
      background: #111111;
      border: 1px solid #1f1f1f;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 0 40px rgba(255,255,255,0.03);
    }

    .unlock-header h2 {
      font-size: 20px;
      color: #fff;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .task-item {
      background: #0a0a0a;
      border: 1px solid #222222;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .task-item.active {
      border-color: #444444;
      background: #161616;
    }
    .task-item.completed {
      opacity: 0.6;
      border-color: #1a1a1a;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .task-icon {
      width: 32px;
      height: 32px;
      background: #1a1a1a;
      border: 1px solid #262626;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #aaa;
    }
    .task-info h4 {
      font-size: 14px;
      color: #fff;
      margin-bottom: 2px;
    }
    .task-info p {
      font-size: 12px;
      color: #666;
    }
    .task-right {
      font-size: 13px;
      color: #888;
      min-width: 45px;
      text-align: right;
      font-weight: 500;
    }

    .claim-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #222;
      font-size: 14px;
      font-weight: 600;
      cursor: not-allowed;
      background: #161616;
      color: #444;
      transition: all 0.2s ease;
    }
    .claim-btn.enabled {
      background: linear-gradient(135deg, #fff, #d0d0d0);
      color: #000;
      border: none;
      cursor: pointer;
    }
    .claim-btn.enabled:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <div id="app">
    <nav class="navbar">
      <div class="nav-left">
        <div class="logo">Chronimium</div>
        <div class="nav-links">
          <button class="nav-btn active" onclick="showPage('dashboard', event)">Dashboard</button>
          <button class="nav-btn" onclick="showPage('explore', event)">Explore</button>
        </div>
      </div>
    </nav>

    <div class="main">
      <!-- DASHBOARD -->
      <div id="dashboard" class="page active">
        <div class="card">
          <div class="brand">CHRONIMIUM</div>
          <h2>Create Locked Link</h2>
          <p class="subtitle">Title + destination + number of tasks</p>

          <input type="text" id="linkTitle" placeholder="Title (name of the link)" maxlength="60">
          <input type="url" id="targetUrl" placeholder="Paste destination link..." autocomplete="off">

          <select id="taskCount">
            <option value="1">1 Task</option>
            <option value="2">2 Tasks</option>
            <option value="3" selected>3 Tasks</option>
            <option value="4">4 Tasks</option>
            <option value="5">5 Tasks</option>
          </select>

          <div class="checkbox-row">
            <input type="checkbox" id="isPublic" checked>
            <label for="isPublic">Make this link public (show in Explore)</label>
          </div>

          <button class="primary" onclick="createLink()">Generate Unlock Link</button>

          <div class="result" id="result">
            <input type="text" id="generatedLink" readonly>
            <button class="copy-btn" onclick="copyLink()">Copy Link</button>
          </div>
        </div>
      </div>

      <!-- EXPLORE -->
      <div id="explore" class="page">
        <h2 style="margin-bottom: 8px; color:#fff;">Explore</h2>
        <p class="subtitle">Publicly shared locked links</p>
        <div class="links-grid" id="linksGrid">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- UNLOCK PAGE -->
  <div id="unlockPage" class="unlock-container" style="display:none;">
    <div class="unlock-card">
      <div class="unlock-header">
        <h2 id="unlockTitle">Complete Tasks to Continue</h2>
      </div>

      <div class="task-list" id="taskList"></div>

      <button class="claim-btn" id="finalBtn" disabled onclick="goToLink()">
        CLAIM REWARD
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDmbZn2A9rC5i2Nz52NEluy2XhwiUqHFe4",
      authDomain: "chronimium-d7a8b.firebaseapp.com",
      projectId: "chronimium-d7a8b",
      storageBucket: "chronimium-d7a8b.firebasestorage.app",
      messagingSenderId: "792047365269",
      appId: "1:792047365269:web:949f11c077693c1d37bf9c",
      measurementId: "G-4Y2SBMDHE0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let exploreUnsubscribe = null;

    function showPage(page, evt) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(page).classList.add('active');
      if (evt && evt.target) {
        evt.target.classList.add('active');
      }
      if (page === 'explore') {
        listenExploreRealtime();
      } else {
        if (exploreUnsubscribe) {
          exploreUnsubscribe();
          exploreUnsubscribe = null;
        }
      }
    }

    async function createLink() {
      const url = document.getElementById('targetUrl').value.trim();
      const title = document.getElementById('linkTitle').value.trim() || 'Untitled Link';
      const tasks = parseInt(document.getElementById('taskCount').value) || 3;
      const isPublic = document.getElementById('isPublic').checked;

      if (!url) {
        alert('Please paste a destination link');
        return;
      }

      const data = { title, url, tasks };
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      const fullLink = window.location.origin + window.location.pathname + '?u=' + encodeURIComponent(encoded);

      try {
        if (isPublic) {
          await db.collection('links').add({
            title,
            encoded,
            tasks,
            public: true,
            createdByName: 'Anonymous',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        document.getElementById('generatedLink').value = fullLink;
        document.getElementById('result').style.display = 'block';
      } catch (err) {
        console.error(err);
        alert('Error creating link');
      }
    }

    function copyLink() {
      document.getElementById('generatedLink').select();
      document.execCommand('copy');
      alert('Link copied!');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function listenExploreRealtime() {
      const grid = document.getElementById('linksGrid');
      grid.innerHTML = '<div class="empty">Loading...</div>';

      if (exploreUnsubscribe) exploreUnsubscribe();

      exploreUnsubscribe = db.collection('links')
        .where('public', '==', true)
        .orderBy('createdAt', 'desc')
        .limit(50)
        .onSnapshot((snap) => {
          if (snap.empty) {
            grid.innerHTML = '<div class="empty">No public links yet</div>';
            return;
          }

          grid.innerHTML = '';
          snap.forEach(doc => {
            const data = doc.data();
            const safe = encodeURIComponent(data.encoded);
            const card = document.createElement('div');
            card.className = 'link-card';
            card.innerHTML = `
              <div class="link-info">
                <h3>${escapeHtml(data.title)}</h3>
                <p>${data.tasks || 1} tasks • by Anonymous</p>
              </div>
              <button class="open-btn" onclick="window.open('?u=${safe}', '_blank')">Open</button>
            `;
            grid.appendChild(card);
          });
        }, (err) => {
          console.error(err);
          grid.innerHTML = '<div class="empty">Error loading links</div>';
        });
    }

    // UNLOCK SYSTEM
    const params = new URLSearchParams(window.location.search);
    const encodedParam = params.get('u');

    let unlockData = null;
    let currentTask = 0;
    let totalTasks = 0;
    let completed = [];
    let isRunning = false;

    if (encodedParam) {
      try {
        const decoded = decodeURIComponent(encodedParam);
        const jsonStr = decodeURIComponent(escape(atob(decoded)));
        unlockData = JSON.parse(jsonStr);
        totalTasks = unlockData.tasks || 1;

        document.getElementById('app').style.display = 'none';
        document.getElementById('unlockPage').style.display = 'flex';
        document.getElementById('unlockTitle').textContent = unlockData.title || 'Complete Tasks to Continue';

        renderTasks();
      } catch (e) {
        alert('Invalid link');
      }
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      for (let i = 0; i < totalTasks; i++) {
        const item = document.createElement('div');
        item.className = 'task-item';
        if (i === currentTask) item.classList.add('active');
        if (completed.includes(i)) item.classList.add('completed');

        let statusText = '—';
        if (completed.includes(i)) statusText = 'Done';
        else if (i === currentTask) statusText = 'Start';

        item.innerHTML = `
          <div class="task-left">
            <div class="task-icon">${completed.includes(i) ? '✓' : '•'}</div>
            <div class="task-info">
              <h4>Task ${i + 1}</h4>
              <p>${completed.includes(i) ? 'Completed' : (i === currentTask ? 'Click to start' : 'Locked')}</p>
            </div>
          </div>
          <div class="task-right" id="status-${i}">${statusText}</div>
        `;

        if (i === currentTask && !completed.includes(i)) {
          item.style.cursor = 'pointer';
          item.onclick = () => startTask(i);
        }

        list.appendChild(item);
      }
    }

    function startTask(index) {
      if (isRunning || index !== currentTask || completed.includes(index)) return;
      isRunning = true;

      const statusEl = document.getElementById('status-' + index);
      let timeLeft = 10;
      statusEl.textContent = timeLeft + 's';

      const timer = setInterval(() => {
        timeLeft--;
        statusEl.textContent = timeLeft + 's';

        if (timeLeft <= 0) {
          clearInterval(timer);
          completed.push(index);
          currentTask++;
          isRunning = false;
          renderTasks();

          if (completed.length >= totalTasks) {
            const btn = document.getElementById('finalBtn');
            btn.disabled = false;
            btn.classList.add('enabled');
            btn.textContent = 'CLAIM REWARD';
          }
        }
      }, 1000);
    }

    function goToLink() {
      if (unlockData && unlockData.url) {
        window.location.href = unlockData.url;
      }
    }
  </script>
</body>
</html>
